services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tierschutz-db
    environment:
      POSTGRES_DB: tierschutz
      POSTGRES_USER: tierschutz
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
